AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SmallOps Platform Backend (Serverless Containerized)

Resources:
  SmallOpsBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 300 # 5 minutes
      MemorySize: 1024
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          LOG_LEVEL: INFO
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.12-v1

Outputs:
  BackendApiUrl:
    Description: "Your Live FastAPI Lambda Function URL"
    Value: !GetAtt SmallOpsBackendFunctionUrl.FunctionUrl
